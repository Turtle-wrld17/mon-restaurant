<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestion Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="dynamicPrintStyle"></style>
<style>
  :root{
    --bg:#F5F6EF; --surface:#FFFFFF; --ink:#24261F; --muted:#6F715F; --line:#E1E1D3;
    --primary:#2F4B3C; --primary-light:#3F614E; --primary-dim:#eef2ec;
    --accent:#D9A441; --accent-dark:#B9862F;
    --danger:#B5533C; --danger-dim:#f7e9e4;
    --success:#4C7A63; --success-dim:#e9f1ec;
    --radius:8px; --shadow:0 2px 10px rgba(36,38,31,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;}
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.01em;color:var(--ink);margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(47,75,60,0.12);}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;min-width:0;}
  a{color:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .offline-banner{background:var(--danger-dim);color:var(--danger);font-size:12.5px;font-weight:600;text-align:center;padding:8px 14px;}
  .app-shell{display:flex;flex:1;min-height:0;}
  .sidebar{width:216px;background:var(--primary);color:#EFEFE6;display:flex;flex-direction:column;padding:22px 14px;flex-shrink:0;}
  .brand{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;padding:0 8px;}
  .brand-sub{font-size:11.5px;color:#B9C9BE;padding:0 8px;margin-bottom:26px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:7px;color:#D7E1DA;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;position:relative;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.13);color:#fff;}
  .nav-badge{background:var(--accent);color:#3a2a08;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:auto;}
  .sidebar-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,0.12);}
  .user-pill{display:flex;align-items:center;gap:9px;font-size:13px;color:#EFEFE6;margin-bottom:10px;}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#3a2a08;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .logout-btn{background:none;border:1px solid rgba(255,255,255,0.25);color:#EFEFE6;padding:7px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;width:100%;}
  .logout-btn:hover{background:rgba(255,255,255,0.08);}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;border-bottom:1px solid var(--line);background:var(--surface);}
  .topbar h1{font-size:22px;}
  .topbar .date{font-size:13px;color:var(--muted);margin-top:2px;}
  .content{padding:26px 30px 130px;flex:1;overflow-y:auto;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:7px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;}
  .btn:hover{background:var(--primary-light);}
  .btn.accent{background:var(--accent);color:#3a2a08;}
  .btn.accent:hover{background:var(--accent-dark);color:#fff;}
  .btn.ghost{background:transparent;color:var(--primary);border-color:var(--line);}
  .btn.ghost:hover{background:var(--primary-dim);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.danger:hover{background:#96412e;}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary);}
  .grid{display:grid;gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .stat-card .stat-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .stat-card .stat-value{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
  .stat-card .stat-note{font-size:12px;color:var(--muted);margin-top:6px;}
  .section-title{font-size:17px;margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .section-title:first-child{margin-top:0;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--line);}
  tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFBF7;}
  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;}
  .table-wrap table td:first-child,.table-wrap table th:first-child{padding-left:18px;}
  .table-wrap table td:last-child,.table-wrap table th:last-child{padding-right:18px;}
  .tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .tag.attente{background:#F3ECD8;color:#8a6d1c;}
  .tag.preparation{background:#EAE4F4;color:#5c4a91;}
  .tag.livraison{background:#dfeaf5;color:#3c6690;}
  .tag.terminee{background:var(--success-dim);color:var(--success);}
  .tag.annulee{background:var(--danger-dim);color:var(--danger);}
  .tag.paye{background:var(--success-dim);color:var(--success);}
  .tag.impaye{background:var(--danger-dim);color:var(--danger);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .display{font-size:19px;color:var(--ink);margin-bottom:6px;}
  .filters{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .filters select,.filters input{width:auto;min-width:150px;}
  .search-input{max-width:240px;}
  .item-line{border:1px solid var(--line);border-radius:7px;padding:14px;margin-bottom:12px;background:#FBFBF7;}
  .item-line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .item-line-head .num{font-weight:600;font-size:13px;color:var(--primary);}
  .supp-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .supp-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;background:#fff;user-select:none;}
  .supp-chip.on{background:var(--primary-dim);border-color:var(--primary-light);color:var(--primary);font-weight:600;}
  .supp-chip input{display:none;}
  .line-total{text-align:right;font-weight:600;margin-top:8px;font-size:14px;}
  .form-footer-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:0 -30px -130px;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .total-display{font-family:'Fraunces',serif;font-size:22px;}
  .total-display span{color:var(--muted);font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;display:block;font-weight:500;}
  .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .type-btn{flex:1;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);background:#fff;}
  .type-btn.on{border-color:var(--primary);background:var(--primary-dim);color:var(--primary);}
  .modal-overlay{position:fixed;inset:0;background:rgba(36,38,31,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow-y:auto;}
  .modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;padding:24px;max-height:88vh;overflow-y:auto;margin:auto;}
  .modal h3{margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .login-screen{min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary);padding:20px;}
  .login-card{background:var(--surface);border-radius:12px;padding:38px 34px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.25);}
  .login-brand{font-family:'Fraunces',serif;font-size:26px;font-weight:700;text-align:center;margin-bottom:4px;}
  .login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px;}
  .user-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .user-select-btn{border:1.5px solid var(--line);border-radius:8px;padding:14px 8px;text-align:center;cursor:pointer;background:#fff;}
  .user-select-btn.chosen{border-color:var(--primary);background:var(--primary-dim);}
  .user-select-btn .ua{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;font-family:'Fraunces',serif;}
  .user-select-btn .un{font-size:13px;font-weight:600;}
  .user-select-btn .ur{font-size:11px;color:var(--muted);}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);}
  .pin-dot.filled{background:var(--primary);border-color:var(--primary);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-key{padding:16px 0;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:600;cursor:pointer;font-family:'Fraunces',serif;}
  .pin-key:hover{background:var(--primary-dim);}
  .login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:16px;}
  .bottom-nav{display:none;}
  #printArea{display:none;}
  .invoice{max-width:420px;margin:0 auto;font-family:'IBM Plex Sans',sans-serif;color:#111;}
  .invoice-head{text-align:center;border-bottom:2px dashed #999;padding-bottom:14px;margin-bottom:14px;}
  .invoice-head h2{font-family:'Fraunces',serif;font-size:20px;}
  .invoice-meta{font-size:12.5px;color:#555;margin-top:6px;line-height:1.6;}
  .invoice table{width:100%;font-size:13px;margin-bottom:10px;}
  .invoice th{border-bottom:1px solid #ccc;text-align:left;padding:4px 0;font-size:11px;}
  .invoice td{padding:5px 0;border-bottom:1px dotted #ddd;}
  .invoice .supp-note{font-size:11px;color:#666;}
  .invoice-total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-top:8px;border-top:2px dashed #999;padding-top:10px;}
  .invoice-sub-row{display:flex;justify-content:space-between;font-size:12.5px;color:#555;padding:2px 0;}
  .invoice-foot{text-align:center;font-size:11.5px;color:#777;margin-top:18px;}
  .proforma{max-width:720px;margin:0 auto;font-family:'IBM Plex Sans',sans-serif;color:#111;font-size:13px;}
  .proforma-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #24261F;padding-bottom:16px;margin-bottom:20px;}
  .proforma-head h2{font-family:'Fraunces',serif;font-size:19px;margin-bottom:6px;}
  .proforma-title{text-align:right;}
  .proforma-title .doctype{font-family:'Fraunces',serif;font-size:22px;font-weight:700;}
  .proforma-parties{display:flex;justify-content:space-between;gap:24px;margin-bottom:20px;}
  .proforma-parties .block{flex:1;}
  .proforma-parties .block-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:#888;margin-bottom:6px;font-weight:600;}
  .proforma table{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .proforma th{background:#F5F6EF;text-align:left;padding:8px 10px;font-size:11px;border-bottom:2px solid #24261F;}
  .proforma td{padding:8px 10px;border-bottom:1px solid #e5e5df;}
  .proforma-totals{margin-left:auto;width:260px;}
  .proforma-totals .r{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
  .proforma-totals .r.total{font-weight:700;font-size:16px;border-top:2px solid #24261F;padding-top:8px;margin-top:4px;}
  .proforma-terms{margin-top:24px;font-size:11.5px;color:#555;line-height:1.6;border-top:1px dashed #ccc;padding-top:14px;}
  .proforma-sign{display:flex;justify-content:space-between;margin-top:50px;}
  .proforma-sign .s{width:200px;text-align:center;font-size:12px;color:#555;border-top:1px solid #999;padding-top:8px;}
  .chart-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .chart-tab{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);}
  .chart-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .bar-wrap{display:flex;align-items:flex-end;gap:8px;height:220px;padding:10px 4px 0;overflow-x:auto;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:24px;}
  .bar{width:70%;background:var(--primary);border-radius:4px 4px 0 0;position:relative;min-height:2px;}
  .bar-val{font-size:10px;color:var(--muted);margin-bottom:4px;white-space:nowrap;}
  .bar-lbl{font-size:10px;color:var(--muted);margin-top:6px;white-space:nowrap;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.2);max-width:90vw;text-align:center;}
  .closing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
  @media (max-width:880px){
    .sidebar{display:none;}
    .content{padding:18px 16px 90px;}
    .topbar{padding:14px 16px;}
    .grid.cols-4{grid-template-columns:repeat(2,1fr);}
    .grid.cols-3{grid-template-columns:repeat(2,1fr);}
    .grid.cols-2{grid-template-columns:1fr;}
    .closing-grid{grid-template-columns:1fr;}
    .form-footer-bar{margin:0 -16px -130px;padding:14px 16px;}
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;}
    .bottom-nav .nav-item{flex-direction:column;color:var(--muted);gap:3px;font-size:10.5px;flex:1;min-width:64px;text-align:center;border-radius:8px;padding:6px 4px;}
    .bottom-nav .nav-item.active{background:var(--primary-dim);color:var(--primary);}
    .bottom-nav .nav-badge{position:absolute;top:2px;right:10px;margin-left:0;}
    .user-select-grid{grid-template-columns:1fr 1fr;}
    .proforma-parties{flex-direction:column;}
  }
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;padding:14px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* =========================================================
   SUPABASE — base de données persistante réelle
   Configure tes identifiants dans config.js (voir README.md)
   ========================================================= */
let sb = null;
let sbConfigOk = false;

function initSupabase(){
  const url = window.SUPABASE_URL, key = window.SUPABASE_ANON_KEY;
  if(typeof window.supabase === 'undefined' || !url || !key || url.indexOf('YOUR-PROJECT')!==-1 || key.indexOf('YOUR-ANON-KEY')!==-1){
    sbConfigOk = false; return;
  }
  sb = window.supabase.createClient(url, key);
  sbConfigOk = true;
}

function downloadFile(filename, content, mime){
  const blob = new Blob(['\ufeff'+content], {type: mime||'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function jclone(x){ return JSON.parse(JSON.stringify(x)); }

const DEFAULTS = {
  products:[
    {id:'p1',name:'Babenda',category:'plat',price:1500,stock:30,seuil:5,unit:'portion'},
    {id:'p2',name:'Riz gras',category:'plat',price:1000,stock:40,seuil:5,unit:'portion'},
    {id:'p3',name:'Attiéké poisson',category:'plat',price:1750,stock:25,seuil:5,unit:'portion'},
    {id:'p4',name:'Poulet braisé attiéké',category:'plat',price:2000,stock:20,seuil:5,unit:'portion'},
    {id:'p5',name:'Riz sauce arachide',category:'plat',price:1200,stock:30,seuil:5,unit:'portion'},
    {id:'s1',name:'Supplément TO',category:'supplement',price:250,stock:100,seuil:10,unit:'portion'},
    {id:'s2',name:'Supplément viande',category:'supplement',price:500,stock:60,seuil:10,unit:'portion'},
    {id:'s3',name:'Supplément sauce',category:'supplement',price:200,stock:80,seuil:10,unit:'portion'},
    {id:'s4',name:'Supplément poisson',category:'supplement',price:600,stock:40,seuil:10,unit:'portion'},
    {id:'b1',name:'Jus de bissap',category:'boisson',price:500,stock:50,seuil:10,unit:'verre'},
    {id:'b2',name:'Eau minérale',category:'boisson',price:300,stock:60,seuil:15,unit:'bouteille'}
  ],
  orders:[],
  users:[
    {id:'u1',name:'Super Admin',role:'superadmin',pin:'0000'},
    {id:'u2',name:'Caissière',role:'caissier',pin:'1111'}
  ],
  delivery:[
    {id:'d1',name:'Issa',phone:'70 00 00 01'},
    {id:'d2',name:'Fatou',phone:'70 00 00 02'}
  ],
  settings:{
    restaurantName:'Mon Restaurant',
    currency:'FCFA',
    printFormat:'thermal',
    proformaValidityDays:15,
    tvaDefaultPercent:0,
    zones:['Ouaga 2000','Gounghin','Tampouy','Zone du Bois','Cissin',"Patte d'Oie",'Dapoya','Karpala','Somgandé'],
    company:{ legalName:'', address:'', phone:'', email:'', ifu:'', rccm:'', bankName:'', bankAccount:'' }
  }
};

let DB = { products:[], orders:[], users:[], delivery:[], settings:{} };
const TABLES = ['products','orders','users','delivery'];

/* ---- CRUD génériques (écrivent dans Supabase si configuré, sinon en mémoire) ---- */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

async function createDoc(table, obj){
  let id;
  if(sb){
    const { data, error } = await sb.from(table).insert({data: obj}).select().single();
    if(error){ console.error(error); toast('Erreur de sauvegarde.'); id = uid(table); }
    else id = data.id;
  } else { id = uid(table); }
  DB[table].push({id, ...jclone(obj)});
  return id;
}
async function updateDoc_(table, id, patch){
  const item = DB[table].find(x=>x.id===id);
  if(item) Object.assign(item, jclone(patch));
  if(sb){
    const merged = item ? jclone(item) : jclone(patch);
    delete merged.id;
    const { error } = await sb.from(table).update({data: merged}).eq('id', id);
    if(error){ console.error(error); toast('Erreur de sauvegarde.'); }
  }
}
async function deleteDocItem(table, id){
  DB[table] = DB[table].filter(x=>x.id!==id);
  if(sb){
    const { error } = await sb.from(table).delete().eq('id', id);
    if(error){ console.error(error); toast('Erreur de suppression.'); }
  }
}
async function saveSettings(patch){
  Object.assign(DB.settings, jclone(patch));
  if(sb){
    const { error } = await sb.from('settings').upsert({id:'main', data: DB.settings});
    if(error){ console.error(error); toast('Erreur de sauvegarde.'); }
  }
}

/* ---- Chargement initial + temps réel ---- */
async function fetchTable(table){
  const { data, error } = await sb.from(table).select('*').order('created_at', {ascending:true});
  if(error){ console.error(error); toast('Erreur de connexion à la base de données.'); return []; }
  return data.map(r=>({id:r.id, ...r.data}));
}
async function fetchSettings(){
  const { data, error } = await sb.from('settings').select('*').eq('id','main').maybeSingle();
  if(error){ console.error(error); return null; }
  return data ? data.data : null;
}
async function seedIfEmpty(){
  for(const t of ['products','users','delivery']){
    const { count } = await sb.from(t).select('*', {count:'exact', head:true});
    if(!count){
      const rows = DEFAULTS[t].map(d=>{ const {id, ...rest} = d; return {data: rest}; });
      await sb.from(t).insert(rows);
    }
  }
  const s = await fetchSettings();
  if(!s){ await sb.from('settings').insert({id:'main', data: DEFAULTS.settings}); }
}
async function initialLoadAll(){
  const [products, orders, users, delivery, settings] = await Promise.all([
    fetchTable('products'), fetchTable('orders'), fetchTable('users'), fetchTable('delivery'), fetchSettings()
  ]);
  DB.products = products; DB.orders = orders; DB.users = users; DB.delivery = delivery;
  DB.settings = settings || jclone(DEFAULTS.settings);
  if(!DB.settings.zones) DB.settings.zones = jclone(DEFAULTS.settings.zones);
  if(!DB.settings.company) DB.settings.company = jclone(DEFAULTS.settings.company);
}
function subscribeAll(){
  TABLES.forEach(t=>{
    sb.channel('changes-'+t)
      .on('postgres_changes', {event:'*', schema:'public', table:t}, async ()=>{ DB[t] = await fetchTable(t); renderFromSnapshot(); })
      .subscribe();
  });
  sb.channel('changes-settings')
    .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, async ()=>{
      const s = await fetchSettings();
      if(s){ DB.settings = s; if(!DB.settings.zones) DB.settings.zones=jclone(DEFAULTS.settings.zones); if(!DB.settings.company) DB.settings.company=jclone(DEFAULTS.settings.company); }
      renderFromSnapshot();
    })
    .subscribe();
}

let initialLoadDone = false;
function renderFromSnapshot(){
  if(!initialLoadDone) return;
  const active = document.activeElement;
  const content = document.getElementById('content');
  if(active && content && content.contains(active) && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName)) return;
  if(document.querySelector('.modal-overlay')) return;
  render();
}

function fmtMoney(n){ return Math.round(n||0).toLocaleString('fr-FR').replace(/,/g,' ') + ' ' + (DB.settings.currency||'FCFA'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function isAdminLike(role){ return role==='admin' || role==='superadmin'; }
function roleLabel(role){ return role==='superadmin' ? 'Super Admin' : role==='admin' ? 'Admin' : 'Caissier(ère)'; }
function countSuperadmins(){ return DB.users.filter(u=>u.role==='superadmin').length; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function navItemsFor(role){
  const base = [
    {r:'dashboard', label:'Tableau de bord', icon:'dashboard'},
    {r:'orders', label:'Commandes', icon:'orders'},
    {r:'sales', label:'Ventes & factures', icon:'sales'}

    base.push({r:'reports', label:'Rapports', icon:'reports'});
    base.push({r:'settings', label:'Paramètres', icon:'settings'});
  }
  return base;
}

function renderRoute(){
  switch(state.route){
    case 'dashboard': return renderDashboard();
    case 'orders': return state.orderDraft ? renderOrderForm() : renderOrders();
    case 'stock': return renderStock();
    case 'sales': return renderSales();
    case 'reports': return renderReports();
    case 'settings': return renderSettings();
    default: return '';
  }
}

function attachLoginEvents(){
  document.querySelectorAll('[data-action="pick-user"]').forEach(el=>{ el.onclick = ()=>{ state.loginStep = {userId:el.dataset.id, pin:'', error:''}; render(); }; });
  document.querySelectorAll('[data-action="pin-key"]').forEach(el=>{
    el.onclick = ()=>{
      if(state.loginStep.pin.length>=4) return;
      state.loginStep.pin += el.dataset.k;
      if(state.loginStep.pin.length===4){
        const u = DB.users.find(x=>x.id===state.loginStep.userId);
        if(u && u.pin===state.loginStep.pin){ state.user=u; state.route='dashboard'; state.loginStep={userId:null,pin:'',error:''}; render(); return; }
        else{ state.loginStep.error='Code PIN incorrect, réessaie.'; state.loginStep.pin=''; }
      }
      render();
    };
  });
  const back = document.querySelector('[data-action="pin-back-user"]');
  if(back) back.onclick = ()=>{ state.loginStep={userId:null,pin:'',error:''}; render(); };
  const clr = document.querySelector('[data-action="pin-clear"]');
  if(clr) clr.onclick = ()=>{ state.loginStep.pin=''; render(); };
}

/* =========================================================
   ÉVÉNEMENTS GLOBAUX
   ========================================================= */
function attachGlobalEvents(){
  document.querySelectorAll('[data-action="nav"]').forEach(el=>{ el.onclick = ()=>{ state.route = el.dataset.route; state.orderDraft=null; render(); }; });
  const lo = document.querySelector('[data-action="logout"]'); if(lo) lo.onclick = ()=>{ state.user=null; render(); };
  const no = document.querySelector('[data-action="new-order"]'); if(no) no.onclick = ()=> startNewOrder();
  bindRouteEvents();
}
function bindRouteEvents(){
  if(state.route==='orders') state.orderDraft ? bindOrderFormEvents() : bindOrdersEvents();
  if(state.route==='stock') bindStockEvents();
  if(state.route==='sales') bindSalesEvents();
  if(state.route==='reports') bindReportsEvents();
  if(state.route==='settings') bindSettingsEvents();
  if(state.route==='dashboard') bindDashboardEvents();
}
function renderPartial(){ document.getElementById('content').innerHTML = renderRoute(); bindRouteEvents(); refreshBadgesOnly(); }
function refreshBadgesOnly(){
  const activeCount = activeOrders().length;
  const lowStockCount = DB.products.filter(p=>p.stock<=p.seuil).length;
  document.querySelectorAll('[data-action="nav"][data-route="orders"] .nav-badge').forEach(b=>b.remove());
  document.querySelectorAll('[data-action="nav"][data-route="stock"] .nav-badge').forEach(b=>b.remove());
  if(activeCount>0) document.querySelectorAll('[data-action="nav"][data-route="orders"]').forEach(el=>el.insertAdjacentHTML('beforeend', `<span class="nav-badge">${activeCount}</span>`));
  if(lowStockCount>0) document.querySelectorAll('[data-action="nav"][data-route="stock"]').forEach(el=>el.insertAdjacentHTML('beforeend', `<span class="nav-badge">${lowStockCount}</span>`));
}

/* =========================================================
   TABLEAU DE BORD
   ========================================================= */
function activeOrders(){ return DB.orders.filter(o=>!['livree','servie','annulee'].includes(o.status)); }
function isRevenueOrder(o){ return o.status!=='annulee'; }
function sumCA(orders, fromDate, toDate){ return orders.filter(o=>isRevenueOrder(o) && o.createdAt.slice(0,10)>=fromDate && o.createdAt.slice(0,10)<=toDate).reduce((s,o)=>s+o.total,0); }
function dateNDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function startOfWeekISO(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
function startOfMonthISO(){ const d=new Date(); d.setDate(1); return d.toISOString().slice(0,10); }

function renderDashboard(){
  const today = todayISO();
  const caJour = sumCA(DB.orders, today, today);
  const caSemaine = sumCA(DB.orders, startOfWeekISO(), today);
  const caMois = sumCA(DB.orders, startOfMonthISO(), today);
  const enCours = activeOrders();
  const lowStock = DB.products.filter(p=>p.stock<=p.seuil);
  const impayees = DB.orders.filter(o=>o.paymentStatus!=='paye' && o.status!=='annulee');
  const ordersToday = DB.orders.filter(o=>o.createdAt.slice(0,10)===today && isRevenueOrder(o));
  const panierMoyen = ordersToday.length ? caJour/ordersToday.length : 0;

  return `
    <div class="grid cols-4">
      <div class="card stat-card"><div class="stat-label">CA aujourd'hui</div><div class="stat-value">${fmtMoney(caJour)}</div><div class="stat-note">${ordersToday.length} commande(s) · panier moyen ${fmtMoney(panierMoyen)}</div></div>
      <div class="card stat-card"><div class="stat-label">CA cette semaine</div><div class="stat-value">${fmtMoney(caSemaine)}</div><div class="stat-note">depuis lundi</div></div>
      <div class="card stat-card"><div class="stat-label">CA ce mois</div><div class="stat-value">${fmtMoney(caMois)}</div><div class="stat-note">depuis le 1er</div></div>
      <div class="card stat-card"><div class="stat-label">Commandes en cours</div><div class="stat-value" style="color:var(--primary);">${enCours.length}</div><div class="stat-note">à préparer / livrer</div></div>
    </div>

    <h2 class="section-title">Commandes en cours</h2>
    ${activeOrdersSectionHtml(enCours)}

    ${isAdminLike(state.user.role) ? '<h2 class="section-title">Alertes de stock</h2>' + lowStockSectionHtml(lowStock) : ''}

    ${impayees.length>0 ? '<h2 class="section-title">Paiements en attente</h2>' + unpaidSectionHtml(impayees) : ''}
  `;
}
function activeOrdersSectionHtml(enCours){
  if(enCours.length===0) return emptyState('Aucune commande en cours','Les nouvelles commandes apparaîtront ici.');
  const rows = enCours.slice(0,8).map(o=>`
        <tr>
          <td><strong>${escapeHtml(o.clientName)}</strong><br><span style="color:var(--muted);font-size:12px;">${o.orderType==='livraison'? '🚚 '+escapeHtml(o.zone||'') : ORDER_TYPE_LABELS[o.orderType]}</span></td>
          <td>${o.items.map(i=>escapeHtml(i.name)).join(', ')}</td>
          <td>${fmtMoney(o.total)}</td>
          <td>${statusTag(o.status)}</td>
          <td>${paymentTag(o.paymentStatus)}</td>
          <td><button class="btn ghost sm" data-action="open-order" data-id="${o.id}">Voir</button></td>
        </tr>`).join('');
  return `<div class="table-wrap"><table>
      <thead><tr><th>Client</th><th>Articles</th><th>Total</th><th>Statut</th><th>Paiement</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function lowStockSectionHtml(lowStock){
  if(lowStock.length===0) return emptyState('Aucune alerte','Tous les produits sont au-dessus du seuil.');
  const rows = lowStock.map(p=>`
        <tr><td>${escapeHtml(p.name)}</td><td><span class="tag annulee">${p.stock} ${escapeHtml(p.unit)}</span></td><td>${p.seuil} ${escapeHtml(p.unit)}</td>
        <td><button class="btn ghost sm" data-action="goto-stock">Gérer</button></td></tr>`).join('');
  return `<div class="table-wrap"><table>
      <thead><tr><th>Produit</th><th>Stock restant</th><th>Seuil d'alerte</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function unpaidSectionHtml(impayees){
  const rows = impayees.slice(0,6).map(o=>`
        <tr><td>${escapeHtml(o.clientName)}</td><td>${fmtMoney(o.total)}</td><td>${statusTag(o.status)}</td>
        <td><button class="btn ghost sm" data-action="open-order" data-id="${o.id}">Voir</button></td></tr>`).join('');
  return `<div class="table-wrap"><table>
      <thead><tr><th>Client</th><th>Total</th><th>Statut commande</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function emptyState(title, sub){ return `<div class="empty-state"><div class="display">${title}</div><div>${sub}</div></div>`; }
function statusTag(s){
  const map = {en_attente:['attente','En attente'], en_preparation:['preparation','En préparation'], en_livraison:['livraison','En livraison'], servie:['terminee','Servie'], livree:['terminee','Livrée'], annulee:['annulee','Annulée']};
  const m = map[s]||['attente',s];
  return `<span class="tag ${m[0]}">${m[1]}</span>`;
}
function paymentTag(p){ return p==='paye' ? `<span class="tag paye">Payé</span>` : `<span class="tag impaye">${p==='a_la_livraison'?'À la livraison':'Non payé'}</span>`; }
function bindDashboardEvents(){
  document.querySelectorAll('[data-action="open-order"]').forEach(el=>{ el.onclick = ()=>{ state.route='orders'; state.orderDraft=null; render(); setTimeout(()=>showOrderDetail(el.dataset.id),0); }; });
  const gs = document.querySelector('[data-action="goto-stock"]'); if(gs) gs.onclick = ()=>{ state.route='stock'; render(); };
}

  return `
    <div class="filters">

  overlay.innerHTML = `
    <div class="modal" style="max-width:500px;">
      <h3>${escapeHtml(o.clientName)} <span style="font-weight:400;color:var(--muted);font-size:13px;">— ${o.invoiceNumber}</span></h3>

            <tr><td>${escapeHtml(i.name)}${i.supplements.length? '<div class="supp-note" style="font-size:11.5px;color:var(--muted);">+ '+i.supplements.map(s=>escapeHtml(s.name)).join(', ')+'</div>':''}</td>

      </div>
      ${o.notes ? `<div class="field"><label>Notes</label><div style="font-size:13.5px;background:#FBFBF7;border:1px solid var(--line);border-radius:6px;padding:8px 10px;">${escapeHtml(o.notes)}</div></div>` : ''}
      <div class="field">
        <label>Statut de la commande</label>
        <select id="statusSelect">
          <option value="en_attente" ${o.status==='en_attente'?'selected':''}>En attente</option>
          <option value="en_preparation" ${o.status==='en_preparation'?'selected':''}>En préparation</option>
          ${o.orderType==='livraison'? `<option value="en_livraison" ${o.status==='en_livraison'?'selected':''}>En livraison</option>
          <option value="livree" ${o.status==='livree'?'selected':''}>Livrée</option>` : `<option value="servie" ${o.status==='servie'?'selected':''}>Servie</option>`}
          <option value="annulee" ${o.status==='annulee'?'selected':''}>Annulée</option>
        </select>
      </div>
      ${o.paymentStatus!=='paye' ? `<button class="btn accent" style="width:100%;margin-bottom:10px;" data-action="mark-paid" data-id="${o.id}">Marquer comme payée</button>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn ghost" style="flex:1;" data-action="print-ticket" data-id="${o.id}">${ICONS.printer} Ticket</button>
        <button class="btn ghost" style="flex:1;" data-action="open-proforma" data-id="${o.id}">${ICONS.doc} Proforma</button>
        ${isAdminLike(state.user.role) ? `<button class="btn danger" data-action="delete-order" data-id="${o.id}">${ICONS.trash}</button>` : ''}
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-action="close-modal">Fermer</button>
        <button class="btn" data-action="save-order-status" data-id="${o.id}">Enregistrer</button>
      </div>
    </div>`;

  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('[data-action="close-modal"]').onclick = ()=>overlay.remove();
  overlay.querySelector('[data-action="save-order-status"]').onclick = async ()=>{
    await updateDoc_('orders', o.id, {status: overlay.querySelector('#statusSelect').value});
    toast('Commande mise à jour.'); overlay.remove(); renderPartial();

  document.querySelectorAll('[data-action="toggle-supp"]').forEach(el=>{
    el.onchange = ()=>{
      const item = d.items[+el.dataset.idx]; const sid = el.dataset.sid;
      if(item.supplementIds.includes(sid)) item.supplementIds = item.supplementIds.filter(x=>x!==sid); else item.supplementIds.push(sid);
      renderPartial();
    };
  });
  document.querySelectorAll('[data-action="remove-item"]').forEach(el=>{ el.onclick = ()=>{ d.items.splice(+el.dataset.idx,1); renderPartial(); }; });
  const addItem = document.querySelector('[data-action="add-item"]'); if(addItem) addItem.onclick = ()=>{ d.items.push(blankItem()); renderPartial(); };
  const cancel = document.querySelector('[data-action="cancel-order"]'); if(cancel) cancel.onclick = ()=>{ state.orderDraft=null; render(); };
  const save = document.querySelector('[data-action="save-order"]'); if(save) save.onclick = saveOrder;
}

async function saveOrder(){
  const d = state.orderDraft;
  if(!d.clientName.trim()){ toast('Indique le nom du client.'); return; }
  const validItems = d.items.filter(i=>i.productId);
  if(validItems.length===0){ toast('Ajoute au moins un plat.'); return; }
  if(d.orderType==='livraison' && !d.zone){ toast('Choisis un quartier de livraison.'); return; }

  const items = validItems.map(i=>{
    const prod = DB.products.find(p=>p.id===i.productId);
    const supplements = i.supplementIds.map(sid=>{ const sp=DB.products.find(p=>p.id===sid); return {productId:sid, name:sp.name, price:sp.price}; });
    const unitTotal = prod.price + supplements.reduce((s,x)=>s+x.price,0);
    return { productId:prod.id, name:prod.name, qty:i.qty, unitPrice:prod.price, supplements, lineTotal: unitTotal*i.qty };
  });
  const subtotal = items.reduce((s,i)=>s+i.lineTotal,0);
  const discount = Math.min(d.discount||0, subtotal);
  const total = Math.max(0, subtotal - discount);
  const deliveryPerson = DB.delivery.find(p=>p.id===d.deliveryPersonId);

  const order = {
    invoiceNumber: 'F-' + Date.now().toString().slice(-8),
    createdAt: new Date().toISOString(),
    clientName: d.clientName.trim(), clientPhone: d.clientPhone.trim(),
    items, subtotal, discount, total,
    orderType: d.orderType,
    zone: d.orderType==='livraison' ? d.zone : '',
    deliveryPersonId: d.orderType==='livraison' ? d.deliveryPersonId : '',
    deliveryPersonName: d.orderType==='livraison' && deliveryPerson ? deliveryPerson.name : '',
    paymentStatus: d.paymentStatus, paymentMethod: d.paymentMethod,
    notes: d.notes||'', status: 'en_attente', createdBy: state.user.name
  };

  const orderId = await createDoc('orders', order);

  for(const i of items){
    const p = DB.products.find(x=>x.id===i.productId);
    if(p) await updateDoc_('products', p.id, {stock: Math.max(0, p.stock - i.qty)});
    for(const s of i.supplements){
      const sp = DB.products.find(x=>x.id===s.productId);
      if(sp) await updateDoc_('products', sp.id, {stock: Math.max(0, sp.stock - i.qty)});
    }
  }

  state.orderDraft = null;
  toast('Commande enregistrée !');
  render();
  const low = DB.products.filter(p=>p.stock<=p.seuil);
  if(low.length>0 && isAdminLike(state.user.role)) toast(low.length+" produit(s) sous le seuil d'alerte.");
}

function printProforma(o, client, tvaPercent, validityDays){

function openProductModal(product){
  const isNew = !product;
  const p = product || {id:'', name:'', category:'plat', price:0, stock:0, seuil:5, unit:'portion'};
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isNew?'Ajouter un produit':'Modifier le produit'}</h3>
      <form id="productForm">
        <div class="field"><label>Nom</label><input required id="f_name" value="${escapeHtml(p.name)}"></div>
        <div class="row">
          <div class="field"><label>Catégorie</label>
            <select id="f_cat">
              <option value="plat" ${p.category==='plat'?'selected':''}>Plat</option>
              <option value="supplement" ${p.category==='supplement'?'selected':''}>Supplément</option>
              <option value="boisson" ${p.category==='boisson'?'selected':''}>Boisson</option>
            </select>
          </div>
          <div class="field"><label>Unité</label><input id="f_unit" value="${escapeHtml(p.unit)}" placeholder="portion, verre..."></div>
        </div>
        <div class="row">
          <div class="field"><label>Prix (${DB.settings.currency})</label><input required type="number" min="0" id="f_price" value="${p.price}"></div>
          <div class="field"><label>Stock actuel</label><input required type="number" min="0" id="f_stock" value="${p.stock}"></div>
        </div>
        <div class="field"><label>Seuil d'alerte</label><input required type="number" min="0" id="f_seuil" value="${p.seuil}"></div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-action="close-modal">Annuler</button>
          <button type="submit" class="btn accent">Enregistrer</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-action="close-modal"]').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#productForm').onsubmit = async (e)=>{
    e.preventDefault();
    const data = {
      name: overlay.querySelector('#f_name').value.trim(), category: overlay.querySelector('#f_cat').value,
      unit: overlay.querySelector('#f_unit').value.trim()||'unité',
      price: parseFloat(overlay.querySelector('#f_price').value)||0,
      stock: parseInt(overlay.querySelector('#f_stock').value)||0,
      seuil: parseInt(overlay.querySelector('#f_seuil').value)||0
    };
    if(isNew) await createDoc('products', data); else await updateDoc_('products', product.id, data);
    toast('Produit enregistré.'); overlay.remove(); renderPartial();
  };
}

function renderCashClosing(){
  const date = state.closingDate || todayISO();

  const cancelled = orders.filter(o=>o.status==='annulee');

  const totalUnpaid = unpaid.reduce((s,o)=>s+o.total,0);

  return `

function printClosing(){

  const unpaid = orders.filter(o=>o.paymentStatus!=='paye' && o.status!=='annulee');
  const byMethod = {especes:0, orange_money:0, moov_money:0, autre:0};
  paid.forEach(o=>{ byMethod[o.paymentMethod||'autre'] = (byMethod[o.paymentMethod||'autre']||0) + o.total; });

      <div class="invoice-sub-row"><span>En attente</span><span>${fmtMoney(unpaid.reduce((s,o)=>s+o.total,0))}</span></div>
      <div class="invoice-foot">${orders.length} commande(s) au total ce jour</div>
    </div>`;

async function exportSalesCsv(){
  const range = state.salesFilter.range;
  let from = todayISO(), to = todayISO();
  if(range==='week') from = startOfWeekISO();
  if(range==='month') from = startOfMonthISO();
  if(range==='all') from = '0000-01-01';
  const list = DB.orders.filter(o=>o.createdAt.slice(0,10)>=from && o.createdAt.slice(0,10)<=to).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const rows = [['Facture','Date','Client','Téléphone','Type','Sous-total','Remise','Total','Paiement','Méthode','Statut']];
  list.forEach(o=>rows.push([o.invoiceNumber, fmtDateTime(o.createdAt), o.clientName, o.clientPhone||'', ORDER_TYPE_LABELS[o.orderType], o.subtotal, o.discount, o.total, o.paymentStatus==='paye'?'Payé':'Non payé', PAYMENT_METHOD_LABELS[o.paymentMethod]||'', statusLabel(o.status)]));
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  downloadFile('ventes_'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8;');
  toast('Export CSV téléchargé.');
}
function statusLabel(s){ return {en_attente:'En attente',en_preparation:'En préparation',en_livraison:'En livraison',servie:'Servie',livree:'Livrée',annulee:'Annulée'}[s]||s; }

/* =========================================================
   RAPPORTS
   ========================================================= */
function renderReports(){
  const tab = state.reportTab;
  let buckets = [];
  if(tab==='jour'){ for(let i=13;i>=0;i--){ const d=dateNDaysAgo(i); buckets.push({label:new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), value: sumCA(DB.orders,d,d)}); } }
  else if(tab==='semaine'){
    for(let i=7;i>=0;i--){
      const end = new Date(); end.setDate(end.getDate()-i*7); const endStr = end.toISOString().slice(0,10);
      const start = new Date(end); start.setDate(start.getDate()-6); const startStr = start.toISOString().slice(0,10);
      buckets.push({label:'S'+(8-i), value: sumCA(DB.orders,startStr,endStr)});
    }
  } else {
    for(let i=11;i>=0;i--){
      const d = new Date(); d.setMonth(d.getMonth()-i,1);
      const start = d.toISOString().slice(0,10);
      const end = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
      buckets.push({label:d.toLocaleDateString('fr-FR',{month:'short'}), value: sumCA(DB.orders,start,end)});
    }
  }
  const max = Math.max(1, ...buckets.map(b=>b.value));
  const salesByProduct = {};
  DB.orders.filter(isRevenueOrder).forEach(o=>o.items.forEach(i=>{ salesByProduct[i.name] = (salesByProduct[i.name]||0) + i.qty; }));
  const top = Object.entries(salesByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `
    <div class="chart-tabs">
      <div class="chart-tab ${tab==='jour'?'active':''}" data-action="report-tab" data-t="jour">Par jour (14j)</div>
      <div class="chart-tab ${tab==='semaine'?'active':''}" data-action="report-tab" data-t="semaine">Par semaine (8s)</div>
      <div class="chart-tab ${tab==='mois'?'active':''}" data-action="report-tab" data-t="mois">Par mois (12m)</div>
    </div>
    <div class="card">
      <div class="bar-wrap">
        ${buckets.map(b=>`
          <div class="bar-col">
            <div class="bar-val">${b.value>0? Math.round(b.value/1000)+'k':''}</div>
            <div class="bar" style="height:${Math.max(2,(b.value/max)*170)}px;" title="${fmtMoney(b.value)}"></div>
            <div class="bar-lbl">${b.label}</div>
          </div>`).join('')}
      </div>
    </div>
    <h2 class="section-title">Produits les plus vendus</h2>
    ${top.length===0? emptyState('Pas encore de données','Les ventes apparaîtront ici.') : `
    <div class="table-wrap"><table><thead><tr><th>Produit</th><th>Quantité vendue</th></tr></thead>
      <tbody>${top.map(([name,qty])=>`<tr><td>${escapeHtml(name)}</td><td>${qty}</td></tr>`).join('')}</tbody>
    </table></div>`}
  `;
}
function bindReportsEvents(){ document.querySelectorAll('[data-action="report-tab"]').forEach(el=>{ el.onclick = ()=>{ state.reportTab = el.dataset.t; renderPartial(); }; }); }

      <tbody>${DB.delivery.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.phone)}</td><td><button class="icon-btn" data-action="delete-delivery" data-id="${p.id}">${ICONS.trash}</button></td></tr>`).join('')}</tbody>
    </table></div>
    <button class="btn ghost sm" style="margin-top:10px;" data-action="new-delivery">${ICONS.plus} Ajouter un livreur</button>

    <h2 class="section-title">Quartiers de livraison</h2>
    <div class="card">
      <div class="supp-list" style="margin-bottom:14px;">
        ${DB.settings.zones.map(z=>`<span class="supp-chip on">${escapeHtml(z)} <span data-action="delete-zone" data-z="${escapeHtml(z)}" style="cursor:pointer;margin-left:4px;">✕</span></span>`).join('')}
      </div>
      <div class="row" style="max-width:400px;">
        <input id="newZone" placeholder="Nouveau quartier...">
        <button class="btn ghost sm" data-action="add-zone" style="flex:0 0 auto;">Ajouter</button>
      </div>
    </div>
  `;
}
function canManageUser(target){
  if(state.user.role==='superadmin') return true;
  if(state.user.role==='admin') return target.role==='caissier';
  return false;
}
function usersTableRowsHtml(){
  return DB.users.map(u=>{
    const manageable = canManageUser(u);
    const isSelf = u.id===state.user.id;
    const isLastSuperadmin = u.role==='superadmin' && countSuperadmins()<=1;
    let actions = '';
    if(manageable) actions += `<button class="icon-btn" data-action="edit-user" data-id="${u.id}">${ICONS.edit}</button>`;
    if(manageable && !isSelf && !isLastSuperadmin) actions += `<button class="icon-btn" data-action="delete-user" data-id="${u.id}">${ICONS.trash}</button>`;
    if(!manageable) actions = `<span style="color:var(--muted);font-size:12px;">—</span>`;
    return `<tr><td>${escapeHtml(u.name)}${isSelf? ' <span style="color:var(--muted);font-size:11.5px;">(toi)</span>':''}</td><td>${roleLabel(u.role)}</td><td>••••</td><td>${actions}</td></tr>`;
  }).join('');
}
function bindSettingsEvents(){
  const rn = document.querySelector('[data-action="save-resto"]');
  if(rn) rn.onclick = async ()=>{
    await saveSettings({ restaurantName: document.getElementById('restoName').value.trim() || 'Mon Restaurant', printFormat: document.getElementById('printFormatSelect').value });
    toast('Enregistré.'); render();
  };
  const sc = document.querySelector('[data-action="save-company"]');
  if(sc) sc.onclick = async ()=>{
    const company = {
      legalName: document.getElementById('c_legal').value.trim(), address: document.getElementById('c_address').value.trim(),
      phone: document.getElementById('c_phone').value.trim(), email: document.getElementById('c_email').value.trim(),
      ifu: document.getElementById('c_ifu').value.trim(), rccm: document.getElementById('c_rccm').value.trim(),
      bankName: document.getElementById('c_bank').value.trim(), bankAccount: document.getElementById('c_iban').value.trim()
    };
    await saveSettings({ company, tvaDefaultPercent: parseFloat(document.getElementById('c_tva').value)||0, proformaValidityDays: parseInt(document.getElementById('c_validity').value)||15 });
    toast('Informations enregistrées.'); renderPartial();
  };
  const nu = document.querySelector('[data-action="new-user"]'); if(nu) nu.onclick = ()=> openUserModal(null);
  document.querySelectorAll('[data-action="edit-user"]').forEach(el=>{ el.onclick = ()=> openUserModal(DB.users.find(u=>u.id===el.dataset.id)); });
  document.querySelectorAll('[data-action="delete-user"]').forEach(el=>{
    el.onclick = async ()=>{
      const target = DB.users.find(x=>x.id===el.dataset.id);
      if(!target || !canManageUser(target)) return;
      if(target.role==='superadmin' && countSuperadmins()<=1){ toast('Impossible : il doit rester au moins un compte Super Admin.'); return; }
      if(confirm('Supprimer ce compte ?')){ await deleteDocItem('users', el.dataset.id); renderPartial(); }
    };
  });
  const nd = document.querySelector('[data-action="new-delivery"]'); if(nd) nd.onclick = ()=> openDeliveryModal();
  document.querySelectorAll('[data-action="delete-delivery"]').forEach(el=>{ el.onclick = async ()=>{ await deleteDocItem('delivery', el.dataset.id); renderPartial(); }; });
  const az = document.querySelector('[data-action="add-zone"]');
  if(az) az.onclick = async ()=>{ const v = document.getElementById('newZone').value.trim(); if(v && !DB.settings.zones.includes(v)){ await saveSettings({zones:[...DB.settings.zones, v]}); renderPartial(); } };
  document.querySelectorAll('[data-action="delete-zone"]').forEach(el=>{ el.onclick = async ()=>{ await saveSettings({zones: DB.settings.zones.filter(z=>z!==el.dataset.z)}); renderPartial(); }; });
}
function openUserModal(user){
  const isNew = !user;
  const u = user || {id:'', name:'', role:'caissier', pin:''};
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isNew?'Ajouter un compte':'Modifier le compte'}</h3>
      <form id="userForm">
        <div class="field"><label>Nom</label><input required id="u_name" value="${escapeHtml(u.name)}"></div>
        <div class="field"><label>Rôle</label>
          <select id="u_role" ${state.user.role!=='superadmin'?'disabled':''}>
            <option value="caissier" ${u.role==='caissier'?'selected':''}>Caissier(ère)</option>
            ${state.user.role==='superadmin' ? `
            <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
            <option value="superadmin" ${u.role==='superadmin'?'selected':''}>Super Admin</option>` : ''}
          </select>
          ${state.user.role!=='superadmin' ? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;">Seul un Super Admin peut attribuer les rôles Admin ou Super Admin.</div>`:''}
        </div>
        <div class="field"><label>Code PIN (4 chiffres)</label><input required maxlength="4" pattern="\\d{4}" id="u_pin" value="${escapeHtml(u.pin)}"></div>
        <div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Annuler</button><button type="submit" class="btn accent">Enregistrer</button></div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-action="close-modal"]').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#userForm').onsubmit = async (e)=>{
    e.preventDefault();
    const data = { name: overlay.querySelector('#u_name').value.trim(), role: overlay.querySelector('#u_role').value, pin: overlay.querySelector('#u_pin').value.trim() };
    if(!/^\d{4}$/.test(data.pin)){ toast('Le code PIN doit contenir 4 chiffres.'); return; }
    if(isNew) await createDoc('users', data); else await updateDoc_('users', user.id, data);
    toast('Compte enregistré.'); overlay.remove(); renderPartial();
  };
}
function openDeliveryModal(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Ajouter un livreur</h3>
      <form id="delForm">
        <div class="field"><label>Nom</label><input required id="d_name"></div>
        <div class="field"><label>Téléphone</label><input id="d_phone"></div>
        <div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Annuler</button><button type="submit" class="btn accent">Ajouter</button></div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-action="close-modal"]').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#delForm').onsubmit = async (e)=>{
    e.preventDefault();
    await createDoc('delivery', { name: overlay.querySelector('#d_name').value.trim(), phone: overlay.querySelector('#d_phone').value.trim() });
    toast('Livreur ajouté.'); overlay.remove(); renderPartial();
  };
}

/* =========================================================
   DÉMARRAGE
   ========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#6F715F;font-family:IBM Plex Sans,sans-serif;">Chargement…</div>';
  initSupabase();
  if(sbConfigOk){
    try{
      await seedIfEmpty();
      await initialLoadAll();
      subscribeAll();
    }catch(e){
      console.error('Erreur de connexion Supabase', e);
      sb = null;
      DB = jclone(DEFAULTS);
    }
  } else {
    DB = jclone(DEFAULTS);
  }
  initialLoadDone = true;
  render();
})();
</script>
</body>
